<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><script>/* iPhone 무음 스위치가 켜져 있어도 소리가 나게 */try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 재생</title>
<style>
:root{--bg:#111;--fg:#eee;--mute:#9a9a9a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box}
video{width:100%;max-height:calc(100% - 30px);background:#000;border-radius:8px}
.lab{font-size:.8rem;color:var(--mute)}
</style></head><body>
<div class="wrap"><video id="v" controls playsinline preload="auto"></video><div class="lab" id="lab"></div></div>
<script>
(function(){
  var L={kband:['clips/kband_history_1.mp4','clips/kband_history_2.mp4'],khiphop:['clips/khiphop_history_1.mp4','clips/khiphop_history_2.mp4']};
  var Q=L[(location.hash||'').slice(1)]||[],i=0,v=document.getElementById('v'),lab=document.getElementById('lab');
  window.playing=false;
  function load(k){ i=k; v.src=Q[i]; lab.textContent=Q.length>1?(i+1)+' / '+Q.length+' 부분 · 끝나면 다음 부분이 이어서 재생됩니다':''; var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  v.addEventListener('ended',function(){ if(i<Q.length-1) load(i+1); });
  if(Q.length) load(0);
})();
</script>
</body></html>
